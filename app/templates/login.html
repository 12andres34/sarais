{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="card card-narrow">
  <h1>Iniciar sesión</h1>
  <p class="muted">Paso 1 de 2: usuario y contraseña.</p>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Usuario
      <input type="text" name="username" value="{{ username or '' }}" maxlength="50" required autofocus autocomplete="username">
    </label>
    <label>Contraseña
      <input type="password" name="password" maxlength="128" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn">Continuar</button>
  </form>
</section>
{% endblock %}

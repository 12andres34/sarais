# Configuración de Nginx para SARAIS (TLS + proxy hacia FastAPI)
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;                 # no revelar la versión de Nginx
    client_max_body_size 10m;          # tamaño máximo de documentos subidos

    # Rutas temporales en /tmp (el contenedor es de solo lectura)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Límite de peticiones al login (apoya el bloqueo por intentos fallidos)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    upstream sarais_app { server app:8000; }

    # Servidor interno solo para el healthcheck (no se publica)
    server {
        listen 127.0.0.1:8080;
        location = /nginx-health { access_log off; return 200 "ok\n"; }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/sarais.crt;
        ssl_certificate_key /etc/nginx/certs/sarais.key;
        # TLS 1.2/1.3 con cifrados AEAD y secreto perfecto hacia adelante (perfil "intermediate" de Mozilla, sin DHE)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_ecdh_curve      X25519:prime256v1:secp384r1;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Cabeceras de seguridad. Reparto (sin duplicados):
        #   la APP envía CSP, X-Frame-Options, X-Content-Type-Options y Referrer-Policy (app/main.py)
        #   NGINX envía solo estas tres. Ningún "location" tiene add_header, así que todos las heredan.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        location = /login {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/proxy_params_sarais;
        }

        location / {
            include /etc/nginx/proxy_params_sarais;
        }
    }
}
